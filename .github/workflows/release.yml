name: Release notarized macOS app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag and draft release containing the notarized ZIP
        required: true
        type: string
      source_commit:
        description: Full commit SHA checked out when building the ZIP
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of the locally notarized ZIP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release scripts and release ordering
        run: |
          set -euo pipefail
          bash -n build.sh Tools/finalize-notarized.sh Tools/verify-notarized-release.sh Tools/sign-release.sh
          python3 Tests/ReleaseOrderTests.py
      - name: Verify that an ad-hoc package is rejected
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/fixture/RadioBar.app"
          mkdir -p "$app/Contents/MacOS"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          printf 'int main(void) { return 0; }\n' | xcrun clang -x c - -o "$app/Contents/MacOS/RadioBar"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2> "$RUNNER_TEMP/old-signature.txt"
          grep -q '^Signature=adhoc$' "$RUNNER_TEMP/old-signature.txt"
          archive="$RUNNER_TEMP/fixture.zip"
          ditto -c -k --keepParent "$app" "$archive"
          expected=$(shasum -a 256 "$archive" | awk '{print $1}')
          if ./Tools/verify-notarized-release.sh "$archive" "$expected"; then
            echo '::error::The ad-hoc release must not pass notarized verification.'
            exit 1
          fi
          echo 'PASS: ad-hoc fixture rejected'

  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the default branch workflow
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Run the release workflow from main.'
          exit 1

      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and draft
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/draft.json"
          jq -e '.isDraft and (.isPrerelease | not) and (.assets | length == 1) and (.assets[0].name == "RadioBar-macOS-arm64.zip")' "$RUNNER_TEMP/draft.json" >/dev/null
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name != $tag)]' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/other-releases.json"
          python3 Tools/check-release-order.py "$RUNNER_TEMP/other-releases.json" "$RELEASE_TAG"
          test -n "${SPARKLE_PRIVATE_KEY:-}" || { echo '::error::Configure SPARKLE_PRIVATE_KEY before releasing.'; exit 1; }
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Download and verify the notarized ZIP
        run: |
          set -euo pipefail
          mkdir -p build
          gh release download "$RELEASE_TAG" --pattern RadioBar-macOS-arm64.zip --dir build
          ./Tools/verify-notarized-release.sh build/RadioBar-macOS-arm64.zip "$ARCHIVE_SHA256"
          (cd build && shasum -a 256 RadioBar-macOS-arm64.zip > SHA256SUMS.txt && shasum -a 256 -c SHA256SUMS.txt)

      - name: Sign update archive and appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./Tools/sign-release.sh

      - name: Upload verified update metadata
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" build/SHA256SUMS.txt build/updates/appcast*.xml
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/final-draft.json"
          jq -e '.isDraft and ([.assets[].name] | sort == (["RadioBar-macOS-arm64.zip", "SHA256SUMS.txt", "appcast.xml", "appcast-en.xml", "appcast-zh-Hans.xml", "appcast-zh-Hant.xml"] | sort))' "$RUNNER_TEMP/final-draft.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/recheck"
          gh release download "$RELEASE_TAG" --pattern RadioBar-macOS-arm64.zip --dir "$RUNNER_TEMP/recheck"
          test "$(shasum -a 256 "$RUNNER_TEMP/recheck/RadioBar-macOS-arm64.zip" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          gh release download "$RELEASE_TAG" --pattern 'appcast*.xml' --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/recheck"
          cmp build/SHA256SUMS.txt "$RUNNER_TEMP/recheck/SHA256SUMS.txt"
          for feed in build/updates/appcast*.xml; do
            cmp "$feed" "$RUNNER_TEMP/recheck/$(basename "$feed")"
          done
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases-final.json"
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name != $tag)]' "$RUNNER_TEMP/releases-final.json" > "$RUNNER_TEMP/other-releases-final.json"
          python3 Tools/check-release-order.py "$RUNNER_TEMP/other-releases-final.json" "$RELEASE_TAG"

      - name: Publish the verified draft
        run: gh release edit "$RELEASE_TAG" --verify-tag --draft=false --latest
